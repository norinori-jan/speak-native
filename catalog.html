<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak Native 目次</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2430;--mute:#667085;--card:#fff;--line:#e4e1d8;--acc:#2a6f6b;--chip:#eef3f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e8e6e1;--mute:#98a2b3;--card:#1c2027;--line:#2c323c;--acc:#6fc3bd;--chip:#232a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.92rem}
.tools{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:2}
input[type=search]{width:100%;padding:12px 14px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:6px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.cat{margin:26px 0 8px;font-size:1.05rem;color:var(--acc);letter-spacing:.02em}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0}
summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.ic{font-size:1.3rem;line-height:1.3}
.nm{font-weight:600}
.meta{color:var(--mute);font-size:.82rem}
ol{margin:0;padding:2px 14px 14px 44px;font-size:.93rem}
li{padding:2px 0}
.none{color:var(--mute);padding:24px 0;text-align:center}
.open{display:inline-block;margin:6px 0 0;color:var(--acc);font-size:.92rem}
</style>
</head>

｜助言はしません：I Don\u0027t Give Advice","🚗 883｜経費の相談：A Question About Expenses","📒 884｜記録を取る：Keep Records","🙇 885｜どうぞ：After You"]}];
var CATS=[
 ['日常会話（基本・短い一言・ロング版）',/^(basic|quick|listen)/],
 ['お金・AI・考える話',/^(talk|fx|money|ai|crypto03|sci|phil)/],
 ['ネットワーク英語',/^net/],
 ['暗号・セキュリティ・仕事',/^(crypto|sec|career)/],
 ['ドラマ・歌',/^(drama|song)/]
];
function catOf(id){for(var i=0;i<CATS.length;i++){if(CATS[i][1].test(id))return CATS[i][0]}return 'その他'}
var names=CATS.map(function(c){return c[0]}).concat(['その他']);
var cur='すべて', q='';
var chipsEl=document.getElementById('chips'), listEl=document.getElementById('list'), noneEl=document.getElementById('none');
var total=0; DATA.forEach(function(p){total+=p.convs.length});
document.getElementById('sum').textContent=DATA.length+' パック・'+total+' 会話';
function mk(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e}
function chips(){
 chipsEl.textContent='';
 ['すべて'].concat(names).forEach(function(n){
  var cnt=n==='すべて'?DATA.length:DATA.filter(function(p){return catOf(p.id)===n}).length;
  if(!cnt)return;
  var b=mk('button','chip',(n==='すべて'?n:n.split('（')[0])+' '+cnt);
  b.type='button';b.setAttribute('aria-pressed',n===cur?'true':'false');
  b.onclick=function(){cur=n;chips();render()};
  chipsEl.appendChild(b)})}
function render(){
 listEl.textContent='';var shown=0;
 names.forEach(function(cn){
  if(cur!=='すべて'&&cur!==cn)return;
  var items=DATA.filter(function(p){
   if(catOf(p.id)!==cn)return false;
   if(!q)return true;
   var hay=(p.n+' '+p.hint+' '+p.convs.join(' ')).toLowerCase();
   return hay.indexOf(q)>=0});
  if(!items.length)return;
  listEl.appendChild(mk('h2','cat',cn));
  items.forEach(function(p){
   shown++;
   var d=document.createElement('details'); if(q)d.open=true;
   var s=mk('summary');
   s.appendChild(mk('span','ic',p.ic));
   var box=mk('div');box.appendChild(mk('div','nm',p.n));
   box.appendChild(mk('div','meta',p.convs.length+' 会話 ・ '+p.id));
   s.appendChild(box);d.appendChild(s);
   var ol=document.createElement('ol');
   p.convs.forEach(function(t){
    var li=mk('li','',t);
    if(q&&t.toLowerCase().indexOf(q)>=0)li.style.fontWeight='600';
    ol.appendChild(li)});
   d.appendChild(ol);listEl.appendChild(d)})});
 noneEl.hidden=shown>0}
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render()});
chips();render();
</script>
